    <div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#1B5CF0;margin-bottom:8px\">RT2<\u002Fdiv>\n            <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Memory poisoning<\u002Fh2>\n            <div>{{ rt2Chart }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:#6B7C99;line-height:1.5;margin:0;padding-top:{{ L.rtNotePad }};text-wrap:pretty\">The attacker inflates the user's baseline first, then spends inside the inflated envelope. Detection is read against the degree of inflation achieved.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:{{ L.rtCols }};gap:48px;align-items:start;border-top:1px solid #E3EAF5;padding-top:48px\">\n          <div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#1B5CF0;margin-bottom:8px\">RT3<\u002Fdiv>\n            <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Mimicry<\u002Fh2>\n            <div style=\"display:flex;gap:48px;align-items:flex-end;height:180px;max-width:420px\">\n              <sc-for list=\"{{ rt3Bars }}\" as=\"b\" hint-placeholder-count=\"2\">\n                <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:8px\">\n                  <div style=\"font-size:13.5px;color:#0A1F3C;font-variant-numeric:tabular-nums\">{{ b.text }}<\u002Fdiv>\n                  <div style=\"width:100%;background:{{ b.color }};height:{{ b.h }};border-radius:2px 2px 0 0;transform-origin:bottom;animation:{{ b.anim }}\"><\u002Fdiv>\n                  <div style=\"font-size:13px;color:#6B7C99\">{{ b.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#33445F;margin-top:16px\">{{ rt3Degradation }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:#6B7C99;line-height:1.5;margin:0;padding-top:{{ L.rtNotePad }};text-wrap:pretty\">The hardest case. Every contextual signal is fakeable — merchant, hour, category. What survives is velocity and reserve utilisation, which an attacker cannot fake while still taking the money.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:{{ L.rtCols }};gap:48px;align-items:start;border-top:1px solid #E3EAF5;padding-top:48px\">\n          <div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#1B5CF0;margin-bottom:8px\">RT4<\u002Fdiv>\n            <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Threshold probing<\u002Fh2>\n            <div style=\"border-left:3px solid #1B5CF0;padding-left:20px;max-width:420px\">\n              <div style=\"font-size:44px;line-height:1.05;letter-spacing:-1.2px;font-weight:700;color:#0A1F3C;font-variant-numeric:tabular-nums\">{{ rt4Queries }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#33445F;margin-top:8px\">queries to locate the boundary<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6B7C99;margin-top:4px;font-variant-numeric:tabular-nums\">{{ rt4Boundary }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:#6B7C99;line-height:1.5;margin:0;padding-top:{{ L.rtNotePad }};text-wrap:pretty\">The boundary was located in this many queries. Withholding the score raises the cost from one query to eight, not to infinity. Rate limiting is the correct mitigation and it is not implemented.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===================== INVESTIGATE ===================== -->\n  <sc-if value=\"{{ showInvestigate }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:12px\">\n      <sc-if value=\"{{ investigateOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width:340px;max-height:60vh;overflow:auto;background:#fff;border:1px solid #E3EAF5;border-radius:8px;box-shadow:0 12px 32px rgba(10,31,60,.12);padding:20px;animation:vk-riseA 180ms ease-out both\">\n          <div style=\"font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;margin-bottom:8px\">Current transaction<\u002Fdiv>\n          <div style=\"font-size:23px;font-weight:700;letter-spacing:-.5px;color:{{ dec.color }};margin-bottom:12px\">{{ dec.label }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:16px\">\n            <sc-for list=\"{{ investigateFactors }}\" as=\"f\" hint-placeholder-count=\"0\">\n              <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#33445F\">{{ f }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#6B7C99\">Audit ID<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#0A1F3C;word-break:break-all\">{{ investigateAudit }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ toggleInvestigate }}\" style=\"height:44px;padding:0 20px;background:#0A1F3C;color:#fff;border:0;border-radius:6px;font-size:14px;cursor:pointer;box-shadow:0 12px 32px rgba(10,31,60,.12)\">Investigate<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultRoute&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;console&quot;,&quot;evaluation&quot;,&quot;threat&quot;,&quot;redteam&quot;],&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;showInvestigate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;pipelineStepMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:150,&quot;min&quot;:60,&quot;max&quot;:300,&quot;step&quot;:10,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nconst STAGES = [\n  ['01','Ingress','validates the event'],\n  ['02','Context','loads baseline and mandate'],\n  ['03','Features','computes 31 values from prior history'],\n  ['04','Policy rules','three deterministic consent checks'],\n  ['05','Model','calibrated probability, grey zone only'],\n  ['06','Decision gate','combines score and rules'],\n  ['07','Explanation','ranks contributing factors'],\n  ['08','Audit','writes a hash-chained record']\n];\n\nconst SOURCES = [\n  ['scheduled_task','scheduled task'],\n  ['user_direct','user, directly'],\n  ['agent_autonomous','agent, on its own'],\n  ['external_content','external content the agent read']\n];\n\nconst SCENARIOS = [\n  {key:'normal', label:'normal purchase'},\n  {key:'unfamiliar', label:'unfamiliar merchant'},\n  {key:'late', label:'late-night'},\n  {key:'large', label:'unusually large'},\n  {key:'external', label:'acted on external content'}\n];\n\nclass Component extends DCLogic {\n  state = {\n    route: 'overview',\n    apiBase: 'https://viveka.onrender.com',\n    baseDraft: 'https://viveka.onrender.com',\n    health: null,\n    principals: [], merchants: [],\n    summary: null, holdout: null, ablation: null, redteam: null,\n    form: { principal_id:'', merchant_id:'', amount_rupees:1200, item_count:1, hour:14,\n            instruction_source:'user_direct', merchant_category:'' },\n    scenario: 'normal',\n    result: null, scoring: false, error: '',\n    traceStep: -1, liveLatency: 0, fadeToggle: false,\n    featuresOpen: false, history: [],\n    outage: false, comparison: null,\n    evalTab: 'holdout', routeC: false,\n    investigateOpen: false,\n    vw: (typeof window !== 'undefined' ? window.innerWidth : 1440),\n    menuOpen: false,\n    healthLatency: null, healthMisses: 0, latTick: false,\n    countP: 0, chartSeed: 0, tabInk: { left: 0, width: 0 },\n    freshEntry: false, prevAction: null\n  };\n\n  reduced(){ return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches; }\n\n  attachMetrics = (el) => {\n    if (!el || this._metricsObserved) return;\n    this._metricsObserved = true;\n    if (this.reduced() || typeof IntersectionObserver !== 'function') { this.setState({ countP: 1 }); return; }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(en => { if (en.isIntersecting) { io.disconnect(); this.countUp(); } });\n    }, { threshold: 0.25 });\n    io.observe(el);\n    this._countFallback = setTimeout(() => this.countUp(), 2000);\n  };\n\n  countUp(){\n    if (this._counted) return; this._counted = true;\n    clearTimeout(this._countFallback);\n    const t0 = performance.now(), dur = 900;\n    const tick = () => {\n      const p = Math.min(1, (performance.now() - t0) / dur);\n      this.setState({ countP: 1 - Math.pow(1 - p, 3) });\n      if (p < 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  async pollHealth(){\n    const t0 = performance.now();\n    try {\n      const h = await this.api('/health');\n      this.setState(st => ({ health: h, healthMisses: 0, healthLatency: Math.round(performance.now() - t0), latTick: !st.latTick }));\n    } catch(e) {\n      this.setState(st => {\n        const misses = st.healthMisses + 1;\n        return misses >= 2 ? { healthMisses: misses, health: null, healthLatency: null } : { healthMisses: misses };\n      });\n    }\n  }\n\n  measureTab(){\n    const el = this._tabEls && this._tabEls[this.state.evalTab];\n    if (!el) return;\n    const left = el.offsetLeft, width = el.offsetWidth;\n    if (left !== this.state.tabInk.left || width !== this.state.tabInk.width) this.setState({ tabInk: { left, width } });\n  }\n  componentDidUpdate(){ if (this.state.route === 'evaluation') this.measureTab(); }\n\n  onResize = () => {\n    const w = window.innerWidth;\n    if (Math.abs(w - this.state.vw) > 4) this.setState({ vw: w });\n  };\n\n  componentDidMount(){\n    window.addEventListener('resize', this.onResize);\n    this._poll = setInterval(() => this.pollHealth(), 15000);\n    const p = this.props.defaultRoute;\n    if (p && p !== 'overview') this.setState({ route: p });\n    const envBase = (typeof window !== 'undefined' && (window.VIVEKA_API_BASE || (window.process && window.process.env && window.process.env.VIVEKA_API_BASE))) || null;\n    if (envBase) this.setState({ apiBase: envBase, baseDraft: envBase }, () => this.loadAll());\n    else this.loadAll();\n  }\n  componentWillUnmount(){ this.clearTimers(); clearInterval(this._poll); clearTimeout(this._countFallback); clearTimeout(this._fresh); window.removeEventListener('resize', this.onResize); }\n  clearTimers(){ (this._timers||[]).forEach(clearTimeout); this._timers=[]; if(this._lat) clearInterval(this._lat); }\n\n  async api(path, opts){\n    const r = await fetch(this.state.apiBase + path, opts);\n    if (!r.ok) throw new Error('HTTP ' + r.status);\n    return r.json();\n  }\n\n  async loadAll(){\n    let health = null, lat = null;\n    const t0 = performance.now();\n    try { health = await this.api('/health'); lat = Math.round(performance.now() - t0); } catch(e) { health = null; }\n    this.setState(st => ({ health, healthLatency: lat, healthMisses: health ? 0 : 2, latTick: !st.latTick }));\n    const grab = async (p) => { try { return await this.api(p); } catch(e){ return null; } };\n    const [principals, merchants, summary, holdout, ablation, redteam] = await Promise.all([\n      grab('/principals?limit=25'), grab('/merchants?limit=40'),\n      grab('/results/summary'), grab('/results/holdout'),\n      grab('/results/ablation'), grab('/results/redteam')\n    ]);\n    this.setState({\n      principals: Array.isArray(principals) ? principals : [],\n      merchants: Array.isArray(merchants) ? merchants : [],\n      summary, holdout, ablation, redteam\n    }, () => this.seedForm());\n  }\n\n  seedForm(){\n    const p = this.state.principals[0];\n    if (!p) return;\n    const scope = p.merchant_scope || [];\n    const cats = this.categories();\n    this.setState(s => ({ form: Object.assign({}, s.form, {\n      principal_id: p.principal_id,\n      merchant_id: scope[0] || (this.state.merchants[0]||{}).merchant_id || '',\n      merchant_category: this.categoryFor(scope[0]) || cats[0] || '',\n      hour: (p.active_hours && p.active_hours.length === 2) ? p.active_hours[0] + 1 : s.form.hour\n    })}));\n  }\n\n  principal(){ return this.state.principals.find(p => p.principal_id === this.state.form.principal_id) || null; }\n  categories(){ const s=new Set(); this.state.merchants.forEach(m => m.category && s.add(m.category)); return Array.from(s).sort(); }\n  categoryFor(id){ const m = this.state.merchants.find(x => x.merchant_id === id); return m ? m.category : ''; }\n\n  // ---------- formatting ----------\n  inr(n){\n    if (n === null || n === undefined || isNaN(n)) return 'not available';\n    const neg = n < 0; let x = Math.round(Math.abs(n)).toString();\n    let last3 = x.slice(-3), rest = x.slice(0, -3);\n    if (rest) rest = rest.replace(/\\B(?=(\\d{2})+(?!\\d))/g, ',');\n    return (neg ? '-₹' : '₹') + (rest ? rest + ',' + last3 : last3);\n  }\n  pct(x, d){ if (x===null||x===undefined||isNaN(x)) return 'not available'; return (x*100).toFixed(d===undefined?1:d) + '%'; }\n  num(x, d){ if (x===null||x===undefined||isNaN(x)) return 'not available'; return Number(x).toFixed(d===undefined?3:d); }\n  compact(n){ if(n===null||n===undefined) return 'not available'; return Number(n).toLocaleString('en-IN'); }\n\n  // ---------- actions ----------\n  setRoute = (r) => () => this.setState({ route: r, menuOpen: false });\n  setField = (k) => (e) => {\n    const v = e && e.target ? e.target.value : e;\n    this.setState(s => ({ form: Object.assign({}, s.form, { [k]: v }) }));\n  };\n\n  applyScenario = (key) => () => {\n    const p = this.principal() || this.state.principals[0];\n    if (!p) { this.setState({ scenario: key }); return; }\n    const scope = p.merchant_scope || [];\n    const outside = this.state.merchants.filter(m => scope.indexOf(m.merchant_id) === -1);\n    const active = p.active_hours || [9, 21];\n    const reserve = p.reserve_rupees || 10000;\n    const base = { principal_id: p.principal_id, merchant_id: scope[0] || '', item_count: 1,\n                   hour: Math.min(23, (active[0] || 9) + 2), instruction_source: 'user_direct',\n                   amount_rupees: Math.max(200, Math.round(reserve * 0.04)) };\n    if (key === 'unfamiliar' && outside[0]) base.merchant_id = outside[0].merchant_id;\n    if (key === 'late') base.hour = 3;\n    if (key === 'large') { base.amount_rupees = Math.round(reserve * 0.85); base.item_count = 1; }\n    if (key === 'external') base.instruction_source = 'external_content';\n    base.merchant_category = this.categoryFor(base.merchant_id) || this.state.form.merchant_category;\n    this.setState({ scenario: key, form: Object.assign({}, this.state.form, base) }, () => this.runScore());\n  };\n\n  timestamp(){\n    const d = new Date(); const p = n => String(n).padStart(2,'0');\n    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(Number(this.state.form.hour))}:30:00`;\n  }\n\n  runScore = async () => {\n    const f = this.state.form;\n    const p = this.principal();\n    if (!p) { this.setState({ error: 'No principal loaded. Start the scoring service and retry.' }); return; }\n    this.clearTimers();\n    this.setState({ scoring: true, error: '', traceStep: -1, liveLatency: 0 });\n    const t0 = performance.now();\n    this._lat = setInterval(() => this.setState({ liveLatency: Math.round(performance.now() - t0) }), 40);\n    const step = Number(this.props.pipelineStepMs) || 150;\n    this._timers = STAGES.map((_, i) => setTimeout(() => this.setState({ traceStep: i }), i * step));\n    const body = {\n      principal_id: f.principal_id, mandate_id: p.mandate_id, merchant_id: f.merchant_id,\n      amount_rupees: Number(f.amount_rupees), timestamp: this.timestamp(),\n      merchant_category: f.merchant_category, instruction_source: f.instruction_source,\n      item_count: Number(f.item_count)\n    };\n    try {\n      const res = await this.api('/explain', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });\n      clearInterval(this._lat);\n      this._timers.push(setTimeout(() => {\n        const entry = {\n          at: new Date(), amount: Number(f.amount_rupees), merchant: f.merchant_id,\n          action: res.recommended_action, result: res, form: Object.assign({}, f)\n        };\n        clearTimeout(this._fresh);\n        this._fresh = setTimeout(() => this.setState({ freshEntry: false }), 2000);\n        this.setState(s => ({\n          result: res, scoring: false, traceStep: STAGES.length - 1,\n          prevAction: s.result ? s.result.recommended_action : null,\n          freshEntry: true, chartSeed: s.chartSeed + 1,\n          fadeToggle: !s.fadeToggle, history: [entry].concat(s.history).slice(0, 40),\n          comparison: s.outage && s.comparison ? { pre: s.comparison.pre, post: res } : s.comparison\n        }));\n      }, STAGES.length * step));\n    } catch (err) {\n      clearInterval(this._lat); this.clearTimers();\n      this.setState({ scoring: false, traceStep: -1, error: 'Scoring failed: ' + err.message + '. Check the API base url and retry.' });\n    }\n  };\n\n  toggleOutage = async () => {\n    const next = !this.state.outage;\n    const pre = this.state.result;\n    try { await this.api('/simulate-outage?enable=' + (next ? 'true' : 'false'), { method:'POST' }); }\n    catch(e){ this.setState({ error: 'Could not reach /simulate-outage: ' + e.message }); return; }\n    this.setState({ outage: next, comparison: next && pre ? { pre, post: null } : null }, () => {\n      if (this.state.result || this.state.form.principal_id) this.runScore();\n    });\n  };\n\n  restore = (entry) => () => this.setState(s => ({ result: entry.result, form: Object.assign({}, entry.form), fadeToggle: !s.fadeToggle, traceStep: STAGES.length - 1 }));\n\n  retry = () => this.setState({ apiBase: this.state.baseDraft }, () => this.loadAll());\n\n  // ---------- charts ----------\n  lineChart(pairs, xLabel, yLabel, annotate){\n    if (!pairs.length) return null;\n    const W = 560, H = 220, L = 48, R = 16, T = 12, B = 36;\n    const xs = pairs.map(p => p[0]), ys = pairs.map(p => p[1]);\n    const xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);\n    const ymax = Math.max(1, Math.max.apply(null, ys));\n    const px = v => L + ((v - xmin) / ((xmax - xmin) || 1)) * (W - L - R);\n    const py = v => T + (1 - v / ymax) * (H - T - B);\n    const e = React.createElement;\n    const pts = pairs.map(p => px(p[0]) + ',' + py(p[1])).join(' ');\n    const kids = [];\n    [0, 0.5, 1].forEach((g, i) => {\n      const y = py(g * ymax);\n      kids.push(e('line', {key:'g'+i, x1:L, x2:W-R, y1:y, y2:y, stroke:'#E3EAF5', strokeWidth:1}));\n      kids.push(e('text', {key:'gt'+i, x:L-8, y:y+4, textAnchor:'end', fontSize:11, fill:'#9AAABF'}, (g*ymax*100).toFixed(0)+'%'));\n    });\n    let len = 0;\n    for (let i=1;i<pairs.length;i++){\n      const dx = px(pairs[i][0]) - px(pairs[i-1][0]), dy = py(pairs[i][1]) - py(pairs[i-1][1]);\n      len += Math.sqrt(dx*dx + dy*dy);\n    }\n    len = Math.ceil(len) + 4;\n    kids.push(e('polyline', {key:'pl', points:pts, fill:'none', stroke:'#1B5CF0', strokeWidth:1.6,\n      strokeDasharray:len, strokeDashoffset:len, style:{animation:'vk-draw 700ms ease-out forwards'}}));\n    pairs.forEach((p, i) => {\n      kids.push(e('circle', {key:'c'+i, cx:px(p[0]), cy:py(p[1]), r:3, fill:'#1B5CF0'}));\n      kids.push(e('text', {key:'x'+i, x:px(p[0]), y:H-14, textAnchor:'middle', fontSize:11, fill:'#6B7C99'}, String(p[0])));\n    });\n    if (annotate){\n      let cross = null;\n      for (let i=1;i<pairs.length;i++){\n        const a = pairs[i-1], b = pairs[i];\n        if ((a[1]-0.5)*(b[1]-0.5) <= 0 && a[1] !== b[1]) { cross = b; break; }\n      }\n      if (cross){\n        kids.push(e('line', {key:'h50', x1:L, x2:W-R, y1:py(0.5), y2:py(0.5), stroke:'#A96500', strokeWidth:1, strokeDasharray:'3 3'}));\n        kids.push(e('text', {key:'h50t', x:px(cross[0])+8, y:py(cross[1])-8, fontSize:11, fill:'#A96500'}, 'detection crosses 50% at ' + cross[0]));\n      }\n    }\n    kids.push(e('text', {key:'xl', x:(L+W-R)/2, y:H-1, textAnchor:'middle', fontSize:11, fill:'#9AAABF'}, xLabel));\n    return e('svg', {viewBox:'0 0 '+W+' '+H, width:'100%', style:{maxWidth:'620px'}, role:'img',\n      'aria-label': yLabel + ' against ' + xLabel + ': ' + pairs.map(p => p[0]+' → '+(p[1]*100).toFixed(0)+'%').join(', ')}, kids);\n  }\n\n  renderVals(){\n    const s = this.state, f = s.form;\n    const online = !!s.health;\n    const degraded = online && s.healthMisses === 1;\n    const cp = s.countP;\n    const anim = (name, dur, ease, delay, fill) => name + ' ' + dur + 'ms ' + (ease||'ease') + ' ' + (delay||0) + 'ms ' + (fill||'both');\n    const seedName = (a, b) => (s.chartSeed % 2 === 0 ? a : b);\n    const still = this.reduced();\n    const p = this.principal();\n    const scope = (p && p.merchant_scope) || [];\n    const sum = s.summary || {};\n    const head = sum.headline || null;\n    const res = s.result;\n\n    const navItems = [['overview','Overview'],['console','Live console'],['evaluation','Evaluation'],['threat','Threat coverage'],['redteam','Red team']];\n    const nav = navItems.map(([k, label]) => ({\n      label, go: this.setRoute(k),\n      color: s.route === k ? '#0A1F3C' : '#33445F',\n      border: s.route === k ? '2px solid #1B5CF0' : '2px solid transparent'\n    }));\n\n    // ----- console -----\n    const active = (p && p.active_hours) || null;\n    let hourBands = [];\n    if (active && active.length === 2){\n      const [a, b] = active;\n      const seg = (x, y) => ({ left: (x/24*100).toFixed(2)+'%', width: ((y-x)/24*100).toFixed(2)+'%' });\n      hourBands = a <= b ? [seg(a, b)] : [seg(a, 24), seg(0, b)];\n    }\n    const hr = Number(f.hour);\n    const outsideHours = !!(active && active.length===2 && (active[0] <= active[1]\n      ? (hr < active[0] || hr > active[1]) : (hr < active[0] && hr > active[1])));\n\n    const merchantsApproved = scope.map(id => ({ id, label: id + (this.categoryFor(id) ? ' · ' + this.categoryFor(id) : '') }));\n    const merchantsOther = s.merchants.filter(m => scope.indexOf(m.merchant_id) === -1)\n      .map(m => ({ id: m.merchant_id, label: m.merchant_id + ' · ' + m.category }));\n\n    const DEC = {\n      allow:   { label:'Allow',   color:'#0A1F3C', bg:'#FFFFFF', meaning:'The transaction proceeds.' },\n      step_up: { label:'Step up', color:'#A96500', bg:'#FFF8EC', meaning:'The user is asked to confirm before it proceeds.' },\n      block:   { label:'Block',   color:'#B31E28', bg:'#FDF2F2', meaning:'Declining is recommended to the issuer.' }\n    };\n    const action = res ? res.recommended_action : 'allow';\n    const d = DEC[action] || DEC.allow;\n    const changed = res && s.prevAction && s.prevAction !== action;\n    const dec = Object.assign({}, d, {\n      disagree: (action === 'step_up' || action === 'block') && s.vw > 768,\n      opacity: s.scoring ? 0.4 : 1,\n      border: changed ? '#B9CDF9' : '#E3EAF5',\n      anim: (s.fadeToggle ? 'vk-fadeA' : 'vk-fadeB') + ' 220ms ease both',\n      drawAnim: still ? 'none' : anim(s.fadeToggle ? 'vk-draw' : 'vk-draw', 400, 'ease-out', 0, 'forwards'),\n      labelAnim: still ? 'n
