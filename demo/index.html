document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Viveka — Agent payment integrity<\u002Ftitle>\n<script src=\"8cc514a8-d5aa-4cce-84ed-88d7f8de7894\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0;background:#FFFFFF}\n  body{-webkit-font-smoothing:antialiased}\n  a{color:#1B5CF0;text-decoration:none}\n  a:hover{color:#1449C8}\n  :focus-visible{outline:2px solid #1B5CF0;outline-offset:2px;border-radius:4px}\n  button,input,select{font-family:inherit}\n  @keyframes vk-gate{0%,100%{opacity:1}50%{opacity:.5}}\n  @keyframes vk-breathe{0%,100%{box-shadow:0 0 0 0 rgba(27,92,240,.5)}50%{box-shadow:0 0 0 4px rgba(27,92,240,0)}}\n  @keyframes vk-fadeA{from{opacity:0}to{opacity:1}}\n  @keyframes vk-fadeB{from{opacity:0}to{opacity:1}}\n  @keyframes vk-riseA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  @keyframes vk-riseB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  @keyframes vk-dropA{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}\n  @keyframes vk-dropB{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}\n  @keyframes vk-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n  @keyframes vk-rise-bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n  @keyframes vk-draw{to{stroke-dashoffset:0}}\n  @keyframes vk-spin{to{transform:rotate(360deg)}}\n  button{white-space:nowrap;transition:transform 80ms ease,background 120ms ease,border-color 120ms ease,color 120ms ease}\n  button:active{transform:scale(.98)}\n  input,select{transition:box-shadow 140ms ease,border-color 140ms ease}\n  input:focus,select:focus{outline:none;border-color:#1B5CF0;box-shadow:0 0 0 3px rgba(27,92,240,.12)}\n  input[type=range]{accent-color:#1B5CF0}\n  input[type=range].vk-out{accent-color:#A96500}\n  tbody tr{transition:background 120ms ease}\n  tbody tr:hover{background:#F7F9FD}\n  svg text{font-variant-numeric:tabular-nums}\n  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif;color:#33445F;font-size:15px;line-height:1.6;background:{{ pageBg }};min-height:100vh\">\n\n  <div style=\"height:30px;background:#F1F5FB;border-bottom:1px solid #E3EAF5;display:flex;align-items:center;justify-content:space-between;padding:{{ L.shellPad }};font-size:12px;color:#6B7C99;overflow:hidden;white-space:nowrap;gap:12px\">\n    <div>Viveka · Agent payment integrity<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px\">\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px\">{{ modelName }}<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:7px;height:7px;border-radius:999px;background:{{ statusDot }};display:inline-block;animation:{{ dotAnim }}\"><\u002Fspan>{{ statusText }}<\u002Fspan>\n      <span style=\"font-variant-numeric:tabular-nums;animation:{{ latAnim }}\">{{ healthLatency }}<\u002Fspan>\n      <span>{{ capabilityLine }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <header style=\"height:64px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #E3EAF5;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:{{ L.shellPad }}\">\n    <div style=\"display:flex;align-items:center;gap:10px;min-width:{{ L.sideMin }}\">\n      <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 26 26\" aria-hidden=\"true\"><path d=\"M4 5 L13 21 L22 5\" fill=\"none\" stroke=\"#1B5CF0\" sc-camel-stroke-width=\"2.6\" sc-camel-stroke-linejoin=\"miter\"><\u002Fpath><path d=\"M9.5 5 L13 11.2 L16.5 5\" fill=\"#1B5CF0\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-size:19px;font-weight:650;color:#0A1F3C;letter-spacing:-.3px\">Viveka<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ navFull }}\" hint-placeholder-val=\"{{ true }}\">\n      <nav style=\"display:flex;gap:{{ L.navGap }};align-items:stretch;height:100%;min-width:0\">\n        <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ n.go }}\" style=\"background:none;border:0;border-bottom:{{ n.border }};padding:0;margin:0;cursor:pointer;font-size:15px;white-space:nowrap;color:{{ n.color }};height:100%;transition:color 120ms\">{{ n.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ navMenu }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:relative\">\n        <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Menu\" style=\"display:flex;flex-direction:column;gap:4px;justify-content:center;width:36px;height:36px;background:none;border:1px solid #E3EAF5;border-radius:6px;cursor:pointer;align-items:center\">\n          <span style=\"width:16px;height:1px;background:#0A1F3C;display:block\"><\u002Fspan>\n          <span style=\"width:16px;height:1px;background:#0A1F3C;display:block\"><\u002Fspan>\n          <span style=\"width:16px;height:1px;background:#0A1F3C;display:block\"><\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;right:0;top:44px;width:220px;background:#fff;border:1px solid #E3EAF5;border-radius:8px;box-shadow:0 12px 32px rgba(10,31,60,.12);padding:8px;display:flex;flex-direction:column;z-index:50\">\n            <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ n.go }}\" style=\"background:none;border:0;text-align:left;padding:10px 12px;border-radius:6px;font-size:15px;cursor:pointer;color:{{ n.color }}\">{{ n.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ navFull }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"min-width:{{ L.sideMin }};display:flex;justify-content:flex-end\">\n        <button sc-camel-on-click=\"{{ goConsole }}\" style=\"background:#1B5CF0;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-size:14px;cursor:pointer;transition:background 120ms\" style-hover=\"background:#1449C8\">Open live console<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ apiOffline }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"height:32px;background:#FDF2F2;border-bottom:1px solid #E3EAF5;display:flex;align-items:center;gap:16px;padding:{{ L.shellPad }};font-size:13px;color:#33445F;overflow-x:auto;white-space:nowrap\">\n      <span style=\"display:flex;align-items:center;gap:7px;color:#B31E28\"><span style=\"width:7px;height:7px;border-radius:999px;background:#B31E28;display:inline-block\"><\u002Fspan>API offline<\u002Fspan>\n      <span style=\"color:#6B7C99\">Live data unavailable.<\u002Fspan>\n      <input value=\"{{ baseDraft }}\" sc-camel-on-change=\"{{ onBase }}\" aria-label=\"API base url\" style=\"flex:0 1 300px;height:22px;border:1px solid #CBD8EC;border-radius:6px;background:#fff;padding:0 8px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#0A1F3C\">\n      <button sc-camel-on-click=\"{{ retry }}\" style=\"height:22px;border:1px solid #B9CDF9;background:#EBF1FE;color:#1B5CF0;border-radius:6px;padding:0 10px;font-size:12px;cursor:pointer\">Retry<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== OVERVIEW ===================== -->\n  <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"padding:{{ L.padPage }};max-width:1280px;margin:0 auto;display:grid;grid-template-columns:{{ L.heroCols }};gap:{{ L.heroGap }};align-items:center\">\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.2px;color:#6B7C99;margin-bottom:20px\">Agent payment integrity<\u002Fdiv>\n        <h1 style=\"font-size:56px;line-height:1.05;letter-spacing:-1.8px;font-weight:700;color:#0A1F3C;margin:0 0 24px\">Authorisation is not intent.<\u002Fh1>\n        <p style=\"font-size:15px;line-height:1.6;color:#33445F;margin:0 0 32px;max-width:52ch;text-wrap:pretty\">A user grants an AI agent a spending mandate once. After that the agent transacts without a PIN. Viveka checks, independently, whether each payment still matches what the user actually intended.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <button sc-camel-on-click=\"{{ goConsole }}\" style=\"background:#1B5CF0;color:#fff;border:0;border-radius:6px;padding:11px 18px;font-size:15px;cursor:pointer;transition:background 120ms\" style-hover=\"background:#1449C8\">Open live console<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goEval }}\" style=\"background:#fff;color:#0A1F3C;border:1px solid #CBD8EC;border-radius:6px;padding:11px 18px;font-size:15px;cursor:pointer;transition:border-color 120ms\" style-hover=\"border-color:#1B5CF0\">See the evaluation<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <svg sc-camel-view-box=\"0 0 560 260\" width=\"100%\" role=\"img\" aria-label=\"A transaction passes an authorisation gate, which is valid, then reaches an integrity gate, which is still evaluating whether the payment matches the user's intent.\">\n          <text x=\"0\" y=\"96\" fill=\"#6B7C99\" font-size=\"12\">agent<\u002Ftext>\n          <line x1=\"48\" y1=\"92\" x2=\"86\" y2=\"92\" stroke=\"#B9CDF9\" sc-camel-stroke-width=\"1\"><\u002Fline>\n          <path d=\"M86 88 L94 92 L86 96 Z\" fill=\"#B9CDF9\"><\u002Fpath>\n          <rect x=\"98\" y=\"52\" width=\"176\" height=\"80\" rx=\"8\" fill=\"#F1F5FB\" stroke=\"#0A1F3C\" sc-camel-stroke-width=\"1\"><\u002Frect>\n          <text x=\"118\" y=\"82\" fill=\"#0A1F3C\" font-size=\"12.5\" font-weight=\"600\" letter-spacing=\".2\">Authorisation<\u002Ftext>\n          <path d=\"M118 98 l5 5 l9 -11\" fill=\"none\" stroke=\"#0A1F3C\" sc-camel-stroke-width=\"1.6\"><\u002Fpath>\n          <text x=\"138\" y=\"103\" fill=\"#0A1F3C\" font-size=\"12.5\">valid<\u002Ftext>\n          <text x=\"98\" y=\"152\" fill=\"#6B7C99\" font-size=\"11.5\">mandate active<\u002Ftext>\n          <text x=\"98\" y=\"169\" fill=\"#6B7C99\" font-size=\"11.5\">within reserve<\u002Ftext>\n          <text x=\"98\" y=\"186\" fill=\"#6B7C99\" font-size=\"11.5\">merchant permitted<\u002Ftext>\n          <line x1=\"274\" y1=\"92\" x2=\"316\" y2=\"92\" stroke=\"#B9CDF9\" sc-camel-stroke-width=\"1\"><\u002Fline>\n          <path d=\"M316 88 L324 92 L316 96 Z\" fill=\"#B9CDF9\"><\u002Fpath>\n          <rect x=\"328\" y=\"52\" width=\"176\" height=\"80\" rx=\"8\" fill=\"#EBF1FE\" stroke=\"#1B5CF0\" sc-camel-stroke-width=\"1\" sc-camel-stroke-dasharray=\"4 4\" style=\"animation:vk-gate 3s ease-in-out infinite\"><\u002Frect>\n          <text x=\"348\" y=\"82\" fill=\"#1B5CF0\" font-size=\"12.5\" font-weight=\"600\" letter-spacing=\".2\">Integrity<\u002Ftext>\n          <text x=\"348\" y=\"103\" fill=\"#1B5CF0\" font-size=\"12.5\">evaluating<\u002Ftext>\n          <text x=\"328\" y=\"152\" fill=\"#6B7C99\" font-size=\"11.5\">is this the<\u002Ftext>\n          <text x=\"328\" y=\"169\" fill=\"#6B7C99\" font-size=\"11.5\">user's intent?<\u002Ftext>\n          <line x1=\"504\" y1=\"92\" x2=\"534\" y2=\"92\" stroke=\"#B9CDF9\" sc-camel-stroke-width=\"1\"><\u002Fline>\n          <text x=\"540\" y=\"97\" fill=\"#1B5CF0\" font-size=\"16\" font-weight=\"700\">?<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#F7F9FD;border-top:1px solid #E3EAF5;border-bottom:1px solid #E3EAF5;padding:{{ L.padPage }}\">\n      <div style=\"max-width:1280px;margin:0 auto\">\n        <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 48px\">One transaction, two questions<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:{{ L.twoCols }};gap:{{ L.twoGap }}\">\n          <div style=\"padding:{{ L.leftPad }};border-right:{{ L.leftBorder }}\">\n            <h3 style=\"font-size:16px;line-height:1.35;letter-spacing:-.2px;font-weight:600;color:#0A1F3C;margin:0 0 24px\">Authorisation — may the agent spend?<\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ authRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:12px;align-items:baseline\">\n                  <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\" style=\"flex:0 0 auto\"><path d=\"M1.5 6.2 L4.5 9.2 L10.5 2.6\" fill=\"none\" stroke=\"#0A1F3C\" sc-camel-stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font-size:15px;color:#33445F\">{{ r }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:32px 0 0;font-size:15px;color:#0A1F3C;font-weight:600\">Valid. Every check passes.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"font-size:16px;line-height:1.35;letter-spacing:-.2px;font-weight:600;color:#0A1F3C;margin:0 0 24px\">Integrity — is this the user's intent?<\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ integrityRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:12px;align-items:baseline\">\n                  <span style=\"flex:0 0 12px;color:#1B5CF0;font-size:13px;font-weight:700\">?<\u002Fspan>\n                  <span style=\"font-size:15px;color:#33445F\">{{ r }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:32px 0 0;font-size:15px;color:#1B5CF0;font-weight:600\">Unanswered by the mandate. Viveka scores this column.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:{{ L.padPage }};max-width:1280px;margin:0 auto\">\n      <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 8px\">How it works<\u002Fh2>\n      <p style=\"margin:0 0 48px;font-size:13.5px;color:#6B7C99\">Every event follows the same path. The order matters — rules are deterministic and run before the model.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:{{ L.stagesCols }};gap:0;border-top:1px solid #E3EAF5\">\n        <sc-for list=\"{{ stagesInfo }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <div style=\"padding:20px 16px 20px 16px;border-left:1px solid #E3EAF5\">\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#1B5CF0;margin-bottom:8px\">{{ s.num }}<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;color:#0A1F3C;margin-bottom:6px\">{{ s.name }}<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.5;color:#6B7C99;text-wrap:pretty\">{{ s.desc }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#F7F9FD;border-top:1px solid #E3EAF5;padding:{{ L.padPage }}\">\n      <div style=\"max-width:1280px;margin:0 auto\">\n        <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 48px\">Measured on the held-out set<\u002Fh2>\n        <sc-if value=\"{{ hasHeadline }}\" hint-placeholder-val=\"{{ true }}\">\n          <div ref=\"{{ attachMetrics }}\" style=\"display:grid;grid-template-columns:{{ L.metricsCols }};gap:48px\">\n            <sc-for list=\"{{ headline }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"border-left:3px solid #1B5CF0;padding-left:20px\">\n                <div style=\"font-size:44px;line-height:1.05;letter-spacing:-1.2px;font-weight:700;color:#0A1F3C;font-variant-numeric:tabular-nums\">{{ m.value }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#33445F;margin-top:8px\">{{ m.caption }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#6B7C99;margin-top:8px;line-height:1.5;text-wrap:pretty\">{{ m.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noHeadline }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px dashed #CBD8EC;border-radius:8px;background:#fff;padding:48px 24px;text-align:center;font-size:12.5px;color:#6B7C99\">No data yet. Start the scoring service and retry.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===================== LIVE CONSOLE ===================== -->\n  <sc-if value=\"{{ isConsole }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1440px;margin:0 auto;padding:{{ L.consolePad }}\">\n    <div style=\"display:grid;grid-template-columns:{{ L.consoleCols }};gap:24px;align-items:start\">\n\n      <div style=\"order:{{ L.composeOrder }};border:1px solid #E3EAF5;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(10,31,60,.04);padding:24px;position:{{ L.composeSticky }};top:96px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px\">\n          <h3 style=\"font-size:16px;font-weight:600;letter-spacing:-.2px;color:#0A1F3C;margin:0\">Compose a transaction<\u002Fh3>\n          <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#6B7C99\">POST /explain<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n          <sc-for list=\"{{ scenarios }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ s.go }}\" style=\"position:relative;overflow:hidden;border:1px solid {{ s.border }};background:#FFFFFF;color:{{ s.color }};border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer\">\n          <span style=\"position:absolute;inset:0;background:#EBF1FE;transform-origin:left;transform:scaleX({{ s.fill }});transition:transform 180ms ease-out\"><\u002Fspan>\n          <span style=\"position:relative\">{{ s.label }}<\u002Fspan>\n        <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;margin-bottom:6px\">Principal<\u002Flabel>\n            <sc-raw-select value=\"{{ form.principal_id }}\" sc-camel-on-change=\"{{ onPrincipal }}\" style=\"width:100%;height:36px;border:1px solid #CBD8EC;border-radius:6px;background:#F1F5FB;padding:0 8px;font-size:13.5px;color:#0A1F3C\">\n              <sc-for list=\"{{ principalOpts }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <option value=\"{{ p.id }}\">{{ p.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;margin-bottom:6px\">Merchant<\u002Flabel>\n            <sc-raw-select value=\"{{ form.merchant_id }}\" sc-camel-on-change=\"{{ onMerchant }}\" style=\"width:100%;height:36px;border:1px solid #CBD8EC;border-radius:6px;background:#F1F5FB;padding:0 8px;font-size:13.5px;color:#0A1F3C\">\n              <optgroup label=\"On the approved list\">\n                <sc-for list=\"{{ merchantsApproved }}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <option value=\"{{ m.id }}\">{{ m.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Foptgroup>\n              <optgroup label=\"Not approved\">\n                <sc-for list=\"{{ merchantsOther }}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <option value=\"{{ m.id }}\">{{ m.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Foptgroup>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <div>\n              <label style=\"display:block;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;margin-bottom:6px\">Amount (₹)<\u002Flabel>\n              <input type=\"number\" value=\"{{ form.amount_rupees }}\" sc-camel-on-change=\"{{ onAmount }}\" style=\"width:100%;height:36px;border:1px solid #CBD8EC;border-radius:6px;background:#F1F5FB;padding:0 8px;font-size:13.5px;color:#0A1F3C;font-variant-numeric:tabular-nums\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;margin-bottom:6px\">Items<\u002Flabel>\n              <input type=\"number\" value=\"{{ form.item_count }}\" sc-camel-on-change=\"{{ onItems }}\" style=\"width:100%;height:36px;border:1px solid #CBD8EC;border-radius:6px;background:#F1F5FB;padding:0 8px;font-size:13.5px;color:#0A1F3C;font-variant-numeric:tabular-nums\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;margin-bottom:6px\">Hour of day<\u002Flabel>\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <div style=\"position:relative;flex:1;height:20px\">\n                <div style=\"position:absolute;left:0;right:0;top:9px;height:3px;background:#E3EAF5;border-radius:999px\"><\u002Fdiv>\n                <sc-for list=\"{{ hourBands }}\" as=\"b\" hint-placeholder-count=\"1\">\n                  <div style=\"position:absolute;top:9px;height:3px;background:#B9CDF9;border-radius:999px;left:{{ b.left }};width:{{ b.width }}\"><\u002Fdiv>\n                <\u002Fsc-for>\n                <input type=\"range\" min=\"0\" max=\"23\" step=\"1\" value=\"{{ form.hour }}\" sc-camel-on-change=\"{{ onHour }}\" aria-label=\"Hour of day\" class=\"{{ hourClass }}\" style=\"position:relative;width:100%;margin:0;background:transparent\">\n              <\u002Fdiv>\n              <span style=\"font-variant-numeric:tabular-nums;font-size:13.5px;color:#0A1F3C;min-width:48px;text-align:right\">{{ hourLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ outsideHours }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12px;color:#A96500;margin-top:6px;animation:vk-fadeA 200ms ease both\">outside this user's usual hours<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;margin-bottom:6px\">Instruction source<\u002Flabel>\n            <sc-raw-select value=\"{{ form.instruction_source }}\" sc-camel-on-change=\"{{ onSource }}\" style=\"width:100%;height:36px;border:1px solid #CBD8EC;border-radius:6px;background:#F1F5FB;padding:0 8px;font-size:13.5px;color:#0A1F3C\">\n              <sc-for list=\"{{ sourceOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;margin-bottom:6px\">Merchant category<\u002Flabel>\n            <sc-raw-select value=\"{{ form.merchant_category }}\" sc-camel-on-change=\"{{ onCategory }}\" style=\"width:100%;height:36px;border:1px solid #CBD8EC;border-radius:6px;background:#F1F5FB;padding:0 8px;font-size:13.5px;color:#0A1F3C\">\n              <sc-for list=\"{{ categoryOpts }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <option value=\"{{ c }}\">{{ c }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ score }}\" disabled=\"{{ scoring }}\" style=\"width:100%;height:40px;border:0;border-radius:6px;background:{{ scoreBtnBg }};color:#fff;font-size:15px;cursor:{{ scoreBtnCursor }};margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px\">\n            <sc-if value=\"{{ scoring }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;display:inline-block;animation:vk-spin 700ms linear infinite\"><\u002Fspan>\n            <\u002Fsc-if>\n            <span>{{ scoreBtnLabel }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:#B31E28;background:#FDF2F2;border:1px solid #E3EAF5;border-radius:6px;padding:8px 10px\">{{ errorText }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"order:{{ L.decisionOrder }};display:flex;flex-direction:column;gap:24px;min-width:0\">\n\n        <sc-if value=\"{{ noResult }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border:1px dashed #CBD8EC;border-radius:8px;background:#fff;padding:64px 24px;text-align:center\">\n            <div style=\"font-size:16px;font-weight:600;color:#0A1F3C;margin-bottom:8px\">Nothing scored yet<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6B7C99\">Pick a scenario on the left, or compose a transaction, then score it.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasResult }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:24px\">\n\n          <div style=\"position:relative;display:grid;grid-template-columns:{{ L.panelCols }};gap:24px;align-items:stretch\">\n            <div style=\"position:relative;overflow:hidden;border:1px solid {{ dec.border }};border-radius:8px;box-shadow:0 1px 3px rgba(10,31,60,.05);background:{{ dec.bg }};padding:24px;display:flex;flex-direction:column;opacity:{{ dec.opacity }};transition:opacity 120ms ease,background 300ms ease,border-color 300ms ease\">\n              <span style=\"position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0))\"><\u002Fspan>\n              <div style=\"font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99\">Integrity decision<\u002Fdiv>\n              <div style=\"font-size:44px;line-height:1.05;letter-spacing:-1.2px;font-weight:700;color:{{ dec.color }};margin-top:12px;animation:{{ dec.anim }}\">{{ dec.label }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#33445F;margin-top:12px;animation:{{ dec.anim }}\">{{ dec.meaning }}<\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:20px\">\n                <span title=\"Under RBI's Authentication Directions the integrity of authentication is the issuer's responsibility. Viveka emits a signal; the issuer decides.\" style=\"display:inline-block;border:1px solid #CBD8EC;border-radius:999px;padding:4px 10px;font-size:12px;color:#6B7C99;background:#fff;cursor:help\">recommendation, not a block<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"position:relative;overflow:hidden;border:1px solid #E3EAF5;border-radius:8px;box-shadow:0 1px 3px rgba(10,31,60,.05);background:#fff;padding:24px;display:flex;flex-direction:column\">\n              <span style=\"position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0))\"><\u002Fspan>\n              <div style=\"font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99\">Authorisation status<\u002Fdiv>\n              <div style=\"font-size:44px;line-height:1.05;letter-spacing:-1.2px;font-weight:700;color:#0A1F3C;margin-top:12px\">Valid<\u002Fdiv>\n              <div style=\"font-size:14px;color:#33445F;margin-top:12px\">The mandate permits this transaction regardless of the decision on the left.<\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ authRowsShort }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:8px;align-items:center;font-size:13px;color:#6B7C99\">\n                    <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M1.5 6.2 L4.5 9.2 L10.5 2.6\" fill=\"none\" stroke=\"#0A1F3C\" sc-camel-stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>{{ r }}\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ dec.disagree }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2\">\n                <svg width=\"1\" height=\"34\" sc-camel-view-box=\"0 0 1 34\" aria-hidden=\"true\" style=\"display:block\">\n                  <line x1=\"0.5\" y1=\"0\" x2=\"0.5\" y2=\"34\" stroke=\"#1B5CF0\" sc-camel-stroke-width=\"1\" sc-camel-stroke-dasharray=\"34\" sc-camel-stroke-dashoffset=\"34\" style=\"animation:{{ dec.drawAnim }}\"><\u002Fline>\n                <\u002Fsvg>\n                <div style=\"background:#fff;border:1px solid #B9CDF9;border-radius:999px;padding:3px 10px;font-size:11.5px;color:#1B5CF0;white-space:nowrap;margin:4px 0;animation:{{ dec.labelAnim }}\">authorisation ≠ integrity<\u002Fdiv>\n                <svg width=\"1\" height=\"34\" sc-camel-view-box=\"0 0 1 34\" aria-hidden=\"true\" style=\"display:block\">\n                  <line x1=\"0.5\" y1=\"34\" x2=\"0.5\" y2=\"0\" stroke=\"#1B5CF0\" sc-camel-stroke-width=\"1\" sc-camel-stroke-dasharray=\"34\" sc-camel-stroke-dashoffset=\"34\" style=\"animation:{{ dec.drawAnim }}\"><\u002Fline>\n                <\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"font-size:13px;color:#6B7C99;line-height:1.5;max-width:88ch;text-wrap:pretty;border-left:1px solid #E3EAF5;padding-left:16px\">No risk score is shown. A score is a gradient. Given gradients, an attacker locates the decision boundary far more cheaply — red-team test RT4 measured this at eight queries with the score withheld. The audit record keeps the exact value.<\u002Fdiv>\n\n          <div style=\"border:1px solid #E3EAF5;border-radius:8px;background:#fff\">\n            <div style=\"padding:20px 24px;border-bottom:1px solid #E3EAF5;font-size:16px;font-weight:600;letter-spacing:-.2px;color:#0A1F3C\">Why this decision<\u002Fdiv>\n            <div style=\"overflow-x:{{ L.scroll }}\">\n              <sc-for list=\"{{ evidence }}\" as=\"e\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:14px 260px minmax(0,1fr) 120px;gap:16px;align-items:baseline;padding:12px 24px;border-bottom:1px solid #E3EAF5;background:{{ e.bg }};min-width:{{ L.minTable }};animation:{{ e.anim }}\">\n                  <span style=\"width:8px;height:8px;background:{{ e.glyph }};display:inline-block;position:relative;top:-2px\"><\u002Fspan>\n                  <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:{{ e.nameColor }}\">{{ e.name }}<\u002Fspan>\n                  <span style=\"font-size:13.5px;color:#33445F;text-wrap:pretty\">{{ e.text }}<\u002Fspan>\n                  <span style=\"font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:{{ e.valColor }};font-style:{{ e.valStyle }}\">{{ e.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #E3EAF5;border-radius:8px;background:#fff;padding:24px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px\">\n              <h3 style=\"font-size:16px;font-weight:600;letter-spacing:-.2px;color:#0A1F3C;margin:0\">Pipeline trace<\u002Fh3>\n              <span style=\"font-size:13px;color:#6B7C99;font-variant-numeric:tabular-nums;animation:{{ latencySettle }}\">{{ latencyLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"overflow-x:{{ L.scroll }}\">\n            <div style=\"display:flex;align-items:flex-start;min-width:{{ L.minChart }}\">\n              <sc-for list=\"{{ trace }}\" as=\"t\" hint-placeholder-count=\"8\">\n                <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"display:flex;align-items:center\">\n                    <div style=\"width:10px;height:10px;border-radius:999px;background:{{ t.dot }};flex:0 0 auto;transition:background 90ms ease\"><\u002Fdiv>\n                    <div style=\"flex:1;height:1px;background:#E3EAF5;overflow:hidden\">\n                      <div style=\"height:1px;background:#1B5CF0;transform-origin:left;transform:scaleX({{ t.segFill }});transition:transform 60ms linear 90ms\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:{{ t.numColor }}\">{{ t.num }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:{{ t.nameColor }};padding-right:8px\">{{ t.name }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #E3EAF5;border-radius:8px;background:#fff\">\n            <button sc-camel-on-click=\"{{ toggleFeatures }}\" style=\"width:100%;background:none;border:0;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:16px;font-weight:600;letter-spacing:-.2px;color:#0A1F3C\">\n              <span>{{ featureCountLabel }}<\u002Fspan><span style=\"font-size:13px;color:#6B7C99;font-weight:400\">{{ featuresToggleLabel }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ featuresList }}\" hint-placeholder-val=\"{{ false }}\">\n              <dl style=\"margin:0;max-height:320px;overflow:auto;border-top:1px solid #E3EAF5\">\n                <sc-for list=\"{{ featureRows }}\" as=\"f\" hint-placeholder-count=\"8\">\n                  <div style=\"padding:10px 20px;border-bottom:1px solid #E3EAF5;background:{{ f.bg }}\">\n                    <dt style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#0A1F3C\">{{ f.name }}<\u002Fdt>\n                    <dd style=\"margin:4px 0 0;font-size:13px;font-variant-numeric:tabular-nums;color:{{ f.valColor }};font-style:{{ f.valStyle }}\">{{ f.value }}<\u002Fdd>\n                    <dd style=\"margin:2px 0 0;font-size:12.5px;color:#1B5CF0\">{{ f.contrib }}<\u002Fdd>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdl>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ featuresTable }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-height:320px;overflow:auto;border-top:1px solid #E3EAF5\">\n                <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n                  <sc-raw-thead><sc-raw-tr>\n                    <sc-raw-th style=\"position:sticky;top:0;background:#F1F5FB;text-align:left;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;padding:8px 24px;border-bottom:1px solid #E3EAF5\">Feature<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"position:sticky;top:0;background:#F1F5FB;text-align:right;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;padding:8px 16px;border-bottom:1px solid #E3EAF5\">Value<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"position:sticky;top:0;background:#F1F5FB;text-align:left;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;padding:8px 24px;border-bottom:1px solid #E3EAF5\">Contribution<\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ featureRows }}\" as=\"f\" hint-placeholder-count=\"8\">\n                      <sc-raw-tr style=\"background:{{ f.bg }}\">\n                        <sc-raw-td style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#0A1F3C;padding:7px 24px;border-bottom:1px solid #E3EAF5\">{{ f.name }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"text-align:right;font-size:13px;padding:7px 16px;border-bottom:1px solid #E3EAF5;font-variant-numeric:tabular-nums;color:{{ f.valColor }};font-style:{{ f.valStyle }}\">{{ f.value }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"font-size:13px;padding:7px 24px;border-bottom:1px solid #E3EAF5;color:#1B5CF0\">{{ f.contrib }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #E3EAF5;border-radius:8px;background:#F7F9FD;padding:16px 24px;display:flex;flex-wrap:wrap;gap:24px;align-items:center\">\n            <sc-for list=\"{{ auditBits }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div><div style=\"font-size:12px;color:#6B7C99\">{{ a.label }}<\u002Fdiv><div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#0A1F3C\">{{ a.value }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"flex:1;min-width:240px;font-size:13px;color:#6B7C99;text-align:right\">Hash-chained to the previous record. Altering any record breaks every hash after it.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"border:1px solid #E3EAF5;border-radius:8px;background:#fff\">\n          <div style=\"padding:20px 24px;border-bottom:1px solid #E3EAF5;display:flex;justify-content:space-between;align-items:baseline\">\n            <h3 style=\"font-size:16px;font-weight:600;letter-spacing:-.2px;color:#0A1F3C;margin:0\">Decision history<\u002Fh3>\n            <span style=\"font-size:13px;color:#6B7C99\">{{ historyCount }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ noHistory }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin:16px 24px 20px;border:1px dashed #CBD8EC;border-radius:8px;padding:32px 24px;text-align:center;font-size:12.5px;color:#6B7C99\">Nothing scored this session yet. Each score you run is kept here.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"0\">\n            <button sc-camel-on-click=\"{{ h.restore }}\" style=\"width:100%;display:grid;grid-template-columns:80px 120px minmax(0,1fr) 110px;gap:16px;align-items:center;text-align:left;background:{{ h.bg }};border:0;border-left:2px solid {{ h.mark }};border-bottom:1px solid #E3EAF5;padding:10px 24px 10px 22px;cursor:pointer;font-size:13px;color:#33445F;transition:border-color 400ms ease,background 120ms ease;animation:{{ h.anim }}\">\n              <span style=\"font-variant-numeric:tabular-nums;color:#6B7C99\">{{ h.time }}<\u002Fspan>\n              <span style=\"font-variant-numeric:tabular-nums;color:#0A1F3C\">{{ h.amount }}<\u002Fspan>\n              <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#6B7C99;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ h.merchant }}<\u002Fspan>\n              <span style=\"justify-self:end;border-radius:999px;padding:3px 10px;font-size:12px;background:{{ h.pillBg }};color:{{ h.pillColor }};font-variant-numeric:tabular-nums\">{{ h.pill }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #CBD8EC;border-radius:8px;background:{{ outageBg }};padding:24px\">\n          <h3 style=\"font-size:16px;font-weight:600;letter-spacing:-.2px;color:#0A1F3C;margin:0 0 8px\">Resilience test<\u002Fh3>\n          <p style=\"margin:0 0 16px;font-size:13.5px;color:#33445F;max-width:88ch;text-wrap:pretty\">Disable the scoring model and re-score the same transaction. Viveka fails open — the payment proceeds, flagged as unscored — because a control that halts commerce when it breaks does more damage than the fraud it prevents. Hard rules still apply.<\u002Fp>\n          <button sc-camel-on-click=\"{{ toggleOutage }}\" style=\"border:1px solid #CBD8EC;background:#fff;color:#0A1F3C;border-radius:6px;padding:9px 16px;font-size:14px;cursor:pointer;transition:border-color 120ms\" style-hover=\"border-color:#1B5CF0\">{{ outageBtnLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ hasComparison }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px\">\n              <sc-for list=\"{{ comparison }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div style=\"border:1px solid #E3EAF5;border-radius:8px;background:#fff;padding:16px\">\n                  <div style=\"font-size:12px;color:#6B7C99;margin-bottom:8px\">{{ c.title }}<\u002Fdiv>\n                  <div style=\"font-size:30px;line-height:1.1;letter-spacing:-.8px;font-weight:700;color:{{ c.color }}\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#6B7C99;margin-top:8px\">scored: {{ c.scored }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===================== EVALUATION ===================== -->\n  <sc-if value=\"{{ isEval }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1280px;margin:0 auto;padding:{{ L.padTop }}\">\n    <h1 style=\"font-size:36px;line-height:1.12;letter-spacing:-1px;font-weight:700;color:#0A1F3C;margin:0 0 12px\">Evaluation<\u002Fh1>\n    <p style=\"margin:0 0 32px;font-size:15px;color:#33445F;max-width:76ch;text-wrap:pretty\">Held-out results, attack performance, cost, and model analysis. The held-out set was scored once and nothing was tuned afterwards.<\u002Fp>\n\n    <div style=\"position:relative;display:flex;gap:0;border-bottom:1px solid #E3EAF5;margin-bottom:32px;overflow-x:{{ L.scroll }}\">\n      <sc-for list=\"{{ evalTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.go }}\" ref=\"{{ t.ref }}\" style=\"background:none;border:0;padding:10px 20px 12px;font-size:15px;white-space:nowrap;color:{{ t.color }};cursor:pointer\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"position:absolute;bottom:-1px;height:2px;background:#1B5CF0;left:{{ tabInk.left }};width:{{ tabInk.width }};transition:left 220ms cubic-bezier(.4,0,.2,1),width 220ms cubic-bezier(.4,0,.2,1)\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ evalEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px dashed #CBD8EC;border-radius:8px;background:#fff;padding:48px 24px;text-align:center;font-size:12.5px;color:#6B7C99\">No data yet. Start the scoring service and retry.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabHoldout }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:48px;background:#fff;border:1px solid #E3EAF5;border-radius:8px;padding:24px;animation:{{ tabAnim }}\">\n        <div>\n          <div style=\"display:inline-flex;border:1px solid #CBD8EC;border-radius:6px;overflow:hidden;margin-bottom:16px\">\n            <sc-for list=\"{{ routeToggle }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ r.go }}\" style=\"background:{{ r.bg }};color:{{ r.color }};border:0;padding:7px 14px;font-size:13.5px;cursor:pointer\">{{ r.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;color:#6B7C99;max-width:88ch;line-height:1.5;text-wrap:pretty\">Route C — counterfeit merchant — exists only in the held-out set by design, which raises that split's base rate from 1.3% to 3.4%. PR-AUC rises mechanically with base rate, so the two are not directly comparable. Both are shown.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:{{ L.hoCols }};gap:24px;border-top:1px solid #E3EAF5;padding-top:24px\">\n          <sc-for list=\"{{ hoMetrics }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div>\n              <div style=\"font-size:30px;line-height:1.1;letter-spacing:-.8px;font-weight:700;color:#0A1F3C;font-variant-numeric:tabular-nums\">{{ m.value }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#33445F;margin-top:6px\">{{ m.label }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6B7C99;margin-top:4px;font-variant-numeric:tabular-nums\">{{ m.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div>\n          <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Confusion matrix<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:{{ conf.cols }};grid-template-rows:{{ conf.rows }};gap:4px;max-width:640px;min-height:280px\">\n            <sc-for list=\"{{ conf.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"background:{{ c.bg }};border:1px solid #E3EAF5;border-radius:8px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-height:64px;animation:{{ c.anim }}\">\n                <div style=\"font-size:12px;color:#6B7C99\">{{ c.label }}<\u002Fdiv>\n                <div style=\"font-size:23px;font-weight:700;letter-spacing:-.5px;color:{{ c.color }};font-variant-numeric:tabular-nums\">{{ c.n }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Recall by attack type<\u002Fh2>\n          <div style=\"display:flex;gap:24px;margin-bottom:16px;font-size:12.5px;color:#6B7C99\">\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;background:#1B5CF0;display:inline-block\"><\u002Fspan>full decision path<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;background:#9BB8FA;display:inline-block\"><\u002Fspan>model alone<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px;max-width:900px\">\n            <sc-for list=\"{{ recallBars }}\" as=\"b\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:{{ L.bRecall }} minmax(0,1fr);gap:16px;align-items:center\">\n                <div style=\"font-size:13.5px;color:#33445F\">{{ b.label }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:4px\">\n                  <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"height:12px;background:#1B5CF0;width:{{ b.fullW }};border-radius:2px;transform-origin:left;animation:{{ b.anim }}\"><\u002Fdiv><span style=\"font-size:12.5px;color:#6B7C99;font-variant-numeric:tabular-nums\">{{ b.fullT }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"height:12px;background:#9BB8FA;width:{{ b.modelW }};border-radius:2px;transform-origin:left;animation:{{ b.anim }}\"><\u002Fdiv><span style=\"font-size:12.5px;color:#6B7C99;font-variant-numeric:tabular-nums\">{{ b.modelT }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:24px 0 0;font-size:13px;color:#6B7C99;max-width:88ch;line-height:1.5;text-wrap:pretty\">Route C is the control. No feature targets it and it never appeared in training, so its recall is transfer from other features rather than learning. What it misses is underpricing — nothing in the model treats a low amount as suspicious.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabCost }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:48px;background:#fff;border:1px solid #E3EAF5;border-radius:8px;padding:24px;animation:{{ tabAnim }}\">\n        <div>\n          <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Cost per configuration<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:16px;max-width:760px\">\n            <sc-for list=\"{{ costBars }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:{{ L.bCost }} minmax(0,1fr) 120px;gap:16px;align-items:center\">\n                <div style=\"font-size:13.5px;color:#33445F\">{{ c.label }}<\u002Fdiv>\n                <div style=\"height:14px;background:{{ c.color }};width:{{ c.w }};border-radius:2px;transform-origin:left;animation:{{ c.anim }}\"><\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#0A1F3C;font-variant-numeric:tabular-nums;text-align:right\">{{ c.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:24px 0 0;font-size:13px;color:#6B7C99;max-width:88ch;line-height:1.5;text-wrap:pretty\">The rule layer raises measured cost and was kept regardless. Its three rules enforce consent that was withdrawn, expired, or exceeded. A payment service cannot delegate that to a model at any price. The cost model prices money, not permission.<\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Evasion<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:{{ L.evCols }};gap:24px;max-width:900px\">\n            <sc-for list=\"{{ evasionMetrics }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"border-left:3px solid #1B5CF0;padding-left:16px\">\n                <div style=\"font-size:30px;line-height:1.1;letter-spacing:-.8px;font-weight:700;color:#0A1F3C;font-variant-numeric:tabular-nums\">{{ m.value }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#33445F;margin-top:6px\">{{ m.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Cost assumptions<\u002Fh2>\n          <sc-raw-table style=\"border-collapse:collapse;max-width:640px;width:100%\">\n            <sc-raw-tbody>\n              <sc-for list=\"{{ assumptions }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"padding:10px 16px 10px 0;font-size:13.5px;color:#33445F;border-bottom:1px solid #E3EAF5\">{{ a.label }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 16px;font-size:13.5px;color:#0A1F3C;border-bottom:1px solid #E3EAF5;font-variant-numeric:tabular-nums;text-align:right\">{{ a.value }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 0 10px 16px;border-bottom:1px solid #E3EAF5;text-align:right\"><span style=\"border-radius:999px;padding:3px 10px;font-size:12px;background:{{ a.bg }};color:{{ a.color }}\">{{ a.tag }}<\u002Fspan><\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n          <p style=\"margin:16px 0 0;font-size:13px;color:#6B7C99;max-width:88ch;line-height:1.5\">Three of four cost parameters are assumptions. Sensitivity analysis showed only abandonment rate materially changes the result.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabFeatures }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1px solid #E3EAF5;border-radius:8px;padding:24px;animation:{{ tabAnim }}\">\n        <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 24px\">Permutation importance<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:6px;max-width:960px\">\n          <sc-for list=\"{{ importanceBars }}\" as=\"b\" hint-placeholder-count=\"10\">\n            <div style=\"display:grid;grid-template-columns:{{ L.bImp }} minmax(0,1fr) 90px;gap:16px;align-items:center\">\n              <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#33445F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ b.name }}<\u002Fdiv>\n              <div style=\"position:relative;height:14px\">\n                <div style=\"position:absolute;top:-3px;bottom:-3px;width:1px;background:#CBD8EC;left:{{ b.axis }}\"><\u002Fdiv>\n                <div style=\"position:absolute;top:0;height:14px;background:{{ b.color }};left:{{ b.left }};width:{{ b.w }};border-radius:2px;transform-origin:{{ b.origin }};animation:{{ b.anim }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6B7C99;text-align:right;font-variant-numeric:tabular-nums\">{{ b.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:24px 0 0;font-size:13px;color:#6B7C99;max-width:88ch;line-height:1.5;text-wrap:pretty\">Permutation importance, not the model's built-in importance, which is biased toward high-cardinality features. Negative values mean shuffling that feature slightly improved the model — a sign of noise fitting, and a known cost of shipping the more interpretable model.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabAblation }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1px solid #E3EAF5;border-radius:8px;padding:24px;animation:{{ tabAnim }}\">\n        <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 8px\">Feature group ablation<\u002Fh2>\n        <p style=\"margin:0 0 24px;font-size:13.5px;color:#6B7C99\">{{ ablationSubtitle }}<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:16px;max-width:960px\">\n          <sc-for list=\"{{ ablationBars }}\" as=\"a\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:{{ L.bAbl }} minmax(0,1fr) 200px;gap:16px;align-items:center\">\n              <div style=\"font-size:13.5px;color:#33445F\">{{ a.label }}<\u002Fdiv>\n              <div style=\"height:14px;background:{{ a.color }};width:{{ a.w }};border-radius:2px;transform-origin:left;animation:{{ a.anim }}\"><\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6B7C99;text-align:right;font-variant-numeric:tabular-nums\">{{ a.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:24px 0 0;font-size:13px;color:#6B7C99;max-width:88ch;line-height:1.5;text-wrap:pretty\">{{ ablationNote }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===================== THREAT COVERAGE ===================== -->\n  <sc-if value=\"{{ isThreat }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1280px;margin:0 auto;padding:{{ L.padTop }}\">\n    <h1 style=\"font-size:36px;line-height:1.12;letter-spacing:-1px;font-weight:700;color:#0A1F3C;margin:0 0 12px\">Threat coverage<\u002Fh1>\n    <p style=\"margin:0 0 32px;font-size:15px;color:#33445F;max-width:76ch\">OWASP Top 10 for Agentic Applications, published December 2025, mapped to the controls in this system.<\u002Fp>\n    <sc-if value=\"{{ noOwasp }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px dashed #CBD8EC;border-radius:8px;background:#fff;padding:48px 24px;text-align:center;font-size:12.5px;color:#6B7C99\">No data yet. Start the scoring service and retry.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasOwasp }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-size:13.5px;color:#33445F;margin-bottom:20px\">{{ owaspSummary }}<\u002Fdiv>\n        <div style=\"overflow-x:{{ L.scroll }};background:#fff;border:1px solid #E3EAF5;border-radius:8px\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:{{ L.minTable }}\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align:left;background:#F1F5FB;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;padding:10px 16px;border-bottom:1px solid #CBD8EC;width:80px\">ID<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;background:#F1F5FB;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;padding:10px 16px;border-bottom:1px solid #CBD8EC;width:260px\">Threat<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;background:#F1F5FB;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;padding:10px 16px;border-bottom:1px solid #CBD8EC;width:150px\">Status<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;background:#F1F5FB;font-size:12px;font-weight:550;letter-spacing:.2px;color:#6B7C99;padding:10px 16px;border-bottom:1px solid #CBD8EC\">How it is addressed<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ owaspRows }}\" as=\"o\" hint-placeholder-count=\"10\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"padding:14px 16px;border-bottom:1px solid #E3EAF5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#6B7C99;vertical-align:top\">{{ o.id }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:14px 16px;border-bottom:1px solid #E3EAF5;font-size:14px;color:#0A1F3C;vertical-align:top\">{{ o.name }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:14px 16px;border-bottom:1px solid #E3EAF5;vertical-align:top\"><span style=\"border-radius:999px;padding:3px 10px;font-size:12px;background:{{ o.bg }};color:{{ o.color }};white-space:nowrap\">{{ o.status }}<\u002Fspan><\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:14px 16px;border-bottom:1px solid #E3EAF5;font-size:13.5px;color:#33445F;vertical-align:top;text-wrap:pretty\">{{ o.note }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <p style=\"margin:24px 0 0;font-size:13px;color:#6B7C99;max-width:88ch;line-height:1.5;text-wrap:pretty\">Out-of-scope entries are boundary decisions with stated reasons, not gaps. Agent identity verification, for instance, belongs to NPCI's Unified Agent Protocol and is assumed handled upstream.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===================== RED TEAM ===================== -->\n  <sc-if value=\"{{ isRedteam }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1280px;margin:0 auto;padding:{{ L.padTop }}\">\n    <h1 style=\"font-size:36px;line-height:1.12;letter-spacing:-1px;font-weight:700;color:#0A1F3C;margin:0 0 12px\">Red team<\u002Fh1>\n    <p style=\"margin:0 0 48px;font-size:15px;color:#33445F;max-width:76ch;text-wrap:pretty\">Four adversarial attacks against the frozen model. Nothing was fixed afterwards — remediating a weakness you have just measured invalidates the measurement.<\u002Fp>\n    <sc-if value=\"{{ noRedteam }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px dashed #CBD8EC;border-radius:8px;background:#fff;padding:48px 24px;text-align:center;font-size:12.5px;color:#6B7C99\">No data yet. Start the scoring service and retry.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasRedteam }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:64px;background:#fff;border:1px solid #E3EAF5;border-radius:8px;padding:32px\">\n\n        <div style=\"display:grid;grid-template-columns:{{ L.rtCols }};gap:48px;align-items:start\">\n          <div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#1B5CF0;margin-bottom:8px\">RT1<\u002Fdiv>\n            <h2 style=\"font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:650;color:#0A1F3C;margin:0 0 20px\">Adaptive evader<\u002Fh2>\n            <div>{{ rt1Chart }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:#6B7C99;line-height:1.5;margin:0;padding-top:{{ L.rtNotePad }};text-wrap:pretty\">Detection falls gradually rather than off a cliff. An attacker who halves the theft is still caught roughly half the time — evasion costs them most of what they came for.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:{{ L.rtCols }};gap:48px;align-items:start;border-top:1px solid #E3EAF5;padding-top:48px\">\n
